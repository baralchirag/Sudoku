# Cloudflare Workers config. Everything is optional except `main`:
# the worker runs with no bindings at all (leaderboard falls back to memory).
name = "daily-sudoku"
main = "dist/worker.js"
compatibility_date = "2024-11-01"

[build]
command = "node scripts/build.mjs"

[vars]
LAUNCH_DATE = "2026-11-01"

# Persistent leaderboards (free tier is plenty). Create with:
#   npx wrangler kv namespace create LEADERBOARD
# then uncomment and paste the id.
# [[kv_namespaces]]
# binding = "LEADERBOARD"
# id = "<your-namespace-id>"

# Set the signing secret once (never commit it):
#   npx wrangler secret put SESSION_SECRET
