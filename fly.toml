# Fly.io app configuration for the Sudoku platform.

app = "sudoku-platform"

[build]
  dockerfile = "Dockerfile"

[env]
  SUDOKU_DATA_FILE = "/data/puzzles.json"
  SUDOKU_STATIC_DIR = "/frontend"

# The Go server listens on 8090 by default.
[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

# Persistent volume so the puzzle pool + daily record survive restarts/deploys.
[[mounts]]
  source = "sudoku_data"
  destination = "/data"