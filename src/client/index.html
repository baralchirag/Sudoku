<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Sudoku</title>
  <meta name="description" content="Four new Sudoku puzzles every day, graded by the techniques they need, with explained hints and a verified daily leaderboard.">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Daily Sudoku">
  <meta property="og:description" content="Four graded puzzles a day. Explained hints. Verified leaderboard.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="/app.css?v={{VERSION}}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app" class="app">
    <main id="main" class="main" tabindex="-1">
      <p class="boot">Loading today's puzzles…</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="boot">Daily Sudoku needs JavaScript to run.</p></noscript>
  <script src="/app.js?v={{VERSION}}" defer></script>
</body>
</html>
